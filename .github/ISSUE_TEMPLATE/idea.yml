name: 💡 Idea / feature request
description: Suggest a new feature or improvement for OpenCTFP
title: "[Idea]: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! The more context you give about *why* you need it, the easier it is to design well.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation or frustration, not the solution yet.
      placeholder: When running an event for a large class, I can't tell which players are stuck…
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: What would you like to happen? Mock-ups, sketches and examples from other CTF platforms are welcome.
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who is this for?
      multiple: true
      options:
        - Players
        - Organisers
        - Owners / platform admins
        - Challenge package authors
        - People hosting the platform
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts / login / roles
        - Events / challenges / hints
        - Flags / redemption / scoring
        - Live leaderboard / realtime
        - Host mode / podium
        - Player instances (Docker)
        - Routing / instance access
        - Challenge packages / manifest
        - Docs
        - Deployment / install
        - Something new
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways you've thought of solving this, or workarounds you use today.
    validations:
      required: false

  - type: textarea
    id: security
    attributes:
      label: Security or fairness impact
      description: Could this let players cheat, see each other's flags, escape their instance, or affect scoring? Write "None" if you don't think so.
    validations:
      required: false

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to help build it?
      options:
        - Yes, I'd like to open a PR
        - Maybe, with some guidance
        - No, just suggesting
    validations:
      required: false
