name: 🐛 Bug report
description: Something in OpenCTFP isn't working as expected
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        **Found a security vulnerability?** Please don't open a public issue — use [private vulnerability reporting](https://github.com/Proteus-Systems/OpenCTFP/security/advisories/new) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I pause the event, the timer on the projector keeps counting down…
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The minimum steps needed to see the bug.
      placeholder: |
        1. Create an event with 2 challenges
        2. Start it, then press Pause
        3. Open host mode
        4. See that the timer is still running
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the platform is affected? (Best guess is fine.)
      options:
        - Accounts / login / roles
        - Events / challenges / hints
        - Flags / redemption / scoring
        - Live leaderboard / realtime
        - Host mode / podium
        - Player instances (Docker)
        - Routing / instance access
        - Challenge packages / manifest
        - Docs
        - Deployment / install
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Your role when it happened
      options:
        - Player (temporary account)
        - Player (permanent account)
        - Organiser
        - Owner
        - Host mode / projector
        - Not applicable (e.g. install problem)
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: OpenCTFP version
      description: Image tag or commit you're running, e.g. `v0.3.1` or `main @ fa2fd90`.
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Anything relevant about where it's running.
      placeholder: |
        - Host OS: Ubuntu 24.04
        - Docker version: 28.x
        - Routing mode: subdomain / port
        - Browser: Firefox 140
        - Number of players: ~30
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Platform logs (`docker compose logs platform`), browser console errors or screenshots. **Remove any secrets, flags or passwords first.**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this hasn't been reported yet.
          required: true
        - label: I've removed any secrets, passwords or real flags from this report.
          required: true
